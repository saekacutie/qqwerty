port 1194
proto udp4
dev tun
topology subnet
server 10.8.0.0 255.255.255.0
ifconfig-pool-persist /run/openvpn/ipp.txt

ca /run/openvpn/ca.crt
cert /run/openvpn/server.crt
key /run/openvpn/server.key
tls-crypt /run/openvpn/tls-crypt.key
dh none
tls-version-min 1.2
remote-cert-tls client
verify-client-cert require

data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
auth SHA256
allow-compression no
push "redirect-gateway def1"
push "dhcp-option DNS 1.1.1.1"
keepalive 10 120
max-clients 25
explicit-exit-notify 1
persist-key
persist-tun
status /run/openvpn/status.log
status-version 2
verb 3

script-security 2
up /usr/local/bin/xgcpx-openvpn-up
user nobody
group nogroup
